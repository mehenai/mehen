name: chrome-probe
on: pull_request
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"; df -hT "$RUNNER_TEMP" /tmp /dev/shm | cat; ls -ld "$RUNNER_TEMP" /tmp
          mount | grep -E " / | /home| /tmp| /mnt" | cat
      - run: bun probe-matrix.ts
        timeout-minutes: 8
