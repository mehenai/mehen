name: chrome-probe
on: pull_request
permissions:
  contents: read
jobs:
  read-ahead:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
          chrome() {
            p=$(mktemp -d); s=$(date +%s%N)
            /usr/bin/google-chrome --headless=new --remote-debugging-port=0 --user-data-dir="$p" --no-first-run --no-default-browser-check --disable-gpu --hide-scrollbars about:blank 2>/dev/null & pid=$!
            until [ -s "$p/DevToolsActivePort" ]; do sleep 0.02; [ "$(ms $s)" -gt 60000 ] && break; done
            echo "chrome $1: $(ms $s) ms"; kill $pid; wait $pid 2>/dev/null; sleep 0.3; rm -rf "$p"
          }
          s=$(date +%s%N); find -L /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "read-ahead of $(du -shL /opt/google/chrome | cut -f1): $(ms $s) ms"
          s=$(date +%s%N); find -L /opt/google/chrome -type f -exec cat {} + > /dev/null 2>&1; echo "read-ahead again: $(ms $s) ms"
          chrome first-after-read-ahead
          chrome warm
          s=$(date +%s%N); cat /usr/lib/x86_64-linux-gnu/libLLVM*.so* > /dev/null 2>&1; echo "an unrelated large library never read: $(ms $s) ms for $(du -chL /usr/lib/x86_64-linux-gnu/libLLVM*.so* 2>/dev/null | tail -1 | cut -f1)"
